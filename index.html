<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login-form.css">
    <link rel="stylesheet" href="register-form.css">
    <title>Document</title>
</head>

<body>
    <svg style="display: none">
        <filter id="glass-distortion">
            <feTurbulence type="turbulence" baseFrequency="0.008" numOctaves="2" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="77" />
        </filter>
    </svg>
    <section class="wrapper">
        <div class="glass-filter"></div>
        <div class="glass-overlay"></div>
        <div class="glass-specular"></div>
        <form id="regForm" action="/registration" method="post" novalidate data-js-reg-form class="glass-content animation"
            style="--i:20">
            <h1 class="animation" style="--i:1">Prijava na sistem</h1>
            <div class="form-group animation" style="--i:3">
                <label for="ur">Ime:</label>
                <div class="block">
                    <input id="ur" name="name" class="field-control" type="text" minlength="3" maxlength="15" required
                        aria-errormessage="name-errors">
                    <i class="bx bxs-user"></i>
                </div>
                <span class="field-errors" id="name-errors" data-js-form-field-errors></span>
            </div>
            <div class="form-group animation" style="--i:5">
                <label for="pr">Prezime:</label>
                <div class="block">
                    <input id="pr" name="surname" class="field-control" type="text" minlength="3" maxlength="15"
                        required aria-errormessage="surname-errors">
                    <i class="bx bxs-user"></i>
                </div>
                <span class="field-errors" id="surname-errors" data-js-form-field-errors></span>
            </div>
            <div class="form-group animation" style="--i:7">
                <label for="email">Email:</label>
                <div class="block">
                    <input id="email" name="email" class="field-control" type="email" required
                        aria-errormessage="email-errors">
                    <i class="bx bx-envelope"></i>
                </div>
                <span class="field-errors" id="email-errors" data-js-form-field-errors></span>
            </div>
            <div class="form-group animation" style="--i:9">
                <label for="username">Korisnicko ime:</label>
                <div class="block">
                    <input id="username" name="username" class="field-control" type="text" required
                        aria-errormessage="email-errors">
                    <i class="bx bx-user-circle"></i>
                </div>
                <span class="field-errors" id="username-errors" data-js-form-field-errors></span>
            </div>
            <div class="form-group animation" style="--i:11">
                <label for="username">Lozinka:</label>
                <div class="block">
                    <input id="username" name="username" class="field-control" type="text" required
                        aria-errormessage="email-errors">
                    <i class="bx bx-lock"></i>
                </div>
                <span class="field-errors" id="password-errors" data-js-form-field-errors></span>
            </div>
            <div class="form-group animation" style="--i:13">
                <label for="username">Potvrda lozinke:</label>
                <div class="block">
                    <input id="username" name="username" class="field-control" type="text" required
                        aria-errormessage="password-repeat-errors">
                    <i class="bx bx-lock"></i>
                </div>
                <span class="field-errors" id="password-repeat-errors" data-js-form-field-errors></span>
            </div>
            <button style="--i:15" class="subBtn animation" type="submit">PRIJAVA</button>
            <p style="--i:17" class="form-switch">Vec imate nalog? <a data-js-login-link href="#"
                    class="switch-to-login animation">Login</a></p>
        </form>

        <form id="logForm" action="/login" method="get" novalidate data-js-log-form class="glass-content disactive">
            <h1 style="--i:1">Ulogovanje u sistem</h1>
            <div class="form-group" style="--i:1">
                <label for="username">Korisnicko ime:</label>
                <div class="block">
                    <input id="username" name="username" class="field-control" type="text" required
                        aria-errormessage="email-errors">
                    <i class="bx bx-user-circle"></i>
                </div>
                <span class="field-errors" id="username-errors" data-js-form-field-errors></span>
            </div>
            <div class="form-group" style="--i:11">
                <label for="username">Lozinka:</label>
                <div class="block">
                    <input id="username" name="username" class="field-control" type="text" required
                        aria-errormessage="email-errors">
                    <i class="bx bx-lock"></i>
                </div>
                <span class="field-errors" id="password-errors" data-js-form-field-errors></span>
            </div>
        </form>
    </section>
</body>

</html>
